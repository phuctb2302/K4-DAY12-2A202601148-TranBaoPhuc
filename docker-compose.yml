# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: chat + redis
#
# Khởi động toàn bộ:      docker compose up -d
# Chỉ Redis (để dev):     docker compose up -d redis
# Scale lên 3 instance:   docker compose up -d --scale chat=3
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Đọc từ file .env ngoài máy — KHÔNG viết thẳng giá trị token vào đây
      API_TOKEN: ${API_TOKEN}
      # Trỏ tới service `redis` — trong compose, tên service = hostname
      # KHÔNG dùng localhost (localhost là chính container đó, không phải host)
      REDIS_URL: redis://redis:6379/0
      BUCKET_CAPACITY: ${BUCKET_CAPACITY:-10}
      REFILL_PER_MINUTE: ${REFILL_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

volumes:
  redis-data:
